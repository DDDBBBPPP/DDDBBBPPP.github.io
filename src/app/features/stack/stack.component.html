<section id="stack" class="stack" aria-labelledby="stack-title">
  <div class="container stack-content">
    <div class="section-heading">
      <h2 id="stack-title">{{ 'stack.title' | translate }}</h2>
      <p>{{ 'stack.introduction' | translate }}</p>
    </div>

    <div class="stack-grid">
      @for (category of categories; track category.id) {
        <article class="stack-card">
          <h3>{{ category.titleKey | translate }}</h3>
          <ul [attr.aria-label]="category.titleKey | translate">
            @for (technology of category.technologies; track technology) {
              <li>{{ technology }}</li>
            }
          </ul>
        </article>
      }
    </div>
  </div>
</section>
